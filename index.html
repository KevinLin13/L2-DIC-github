<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kevin Lin — Data Portfolio</title>
    <meta name="description"
        content="Kevin Lin (林建璋) — Aspiring data professional with hands-on projects in data engineering, analytics, and AI applications." />
    <meta name="keywords"
        content="Data Engineer, Data Analyst, AI Application Engineer, MLOps, PyTorch, Portfolio, 林建璋, Kevin Lin" />
    <meta name="author" content="Kevin Lin" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React 18 + Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'Noto Sans TC', 'sans-serif'] },
                    colors: { paper: '#FAFAFA', ink: '#111111' },
                    animation: {
                        'fade-up': 'fadeUp 0.55s ease forwards',
                        'fade-in': 'fadeIn 0.45s ease forwards',
                    },
                    keyframes: {
                        fadeUp: {
                            '0%': { opacity: '0', transform: 'translateY(16px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                    },
                },
            },
        };
    </script>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #FAFAFA;
            color: #111111;
        }

        /* ── Staggered delay helpers ── */
        .d1 {
            animation-delay: 0.08s;
            opacity: 0;
        }

        .d2 {
            animation-delay: 0.18s;
            opacity: 0;
        }

        .d3 {
            animation-delay: 0.28s;
            opacity: 0;
        }

        .d4 {
            animation-delay: 0.38s;
            opacity: 0;
        }

        .d5 {
            animation-delay: 0.48s;
            opacity: 0;
        }

        .d6 {
            animation-delay: 0.58s;
            opacity: 0;
        }

        /* ── Page transition ── */
        .page-enter {
            animation: pageIn 0.35s ease forwards;
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Ghost button ── */
        .ghost-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid #D1D5DB;
            border-radius: 5px;
            font-size: 0.8125rem;
            font-weight: 500;
            color: #374151;
            background: transparent;
            cursor: pointer;
            text-decoration: none;
            transition: border-color 0.2s, background 0.2s, color 0.2s;
            letter-spacing: 0.01em;
            white-space: nowrap;
        }

        .ghost-btn:hover {
            border-color: #111;
            background: #111;
            color: #fff;
        }

        /* ── Project card ── */
        .project-card {
            transition: border-color 0.22s ease, transform 0.22s ease;
        }

        .project-card:hover {
            border-color: #9CA3AF !important;
            transform: translateY(-2px);
        }

        /* ── Article row ── */
        .article-row {
            border-radius: 8px;
            transition: background 0.18s ease;
            cursor: pointer;
        }

        .article-row:hover {
            background: #F9FAFB;
        }

        /* ── Nav link ── */
        .nav-link {
            font-size: 0.875rem;
            font-weight: 500;
            color: #6B7280;
            text-decoration: none;
            transition: color 0.2s;
            letter-spacing: 0.01em;
        }

        .nav-link:hover {
            color: #111;
        }

        .nav-link.is-active {
            color: #111;
            font-weight: 600;
        }

        /* ── Tag chip ── */
        .tag-chip {
            display: inline-block;
            padding: 3px 10px;
            background: #F3F4F6;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #6B7280;
        }

        /* ── Filter tab ── */
        .filter-tab {
            padding: 5px 15px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid #E5E7EB;
            background: #fff;
            color: #6B7280;
            transition: all 0.18s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .filter-tab:hover {
            border-color: #9CA3AF;
            color: #374151;
        }

        .filter-tab.is-active {
            background: #111;
            border-color: #111;
            color: #fff;
        }

        /* ── Search input ── */
        .search-wrap {
            position: relative;
        }

        .search-icon-pos {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9CA3AF;
            pointer-events: none;
            display: flex;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px 10px 42px;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            font-size: 0.875rem;
            color: #111;
            background: #fff;
            outline: none;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input::placeholder {
            color: #9CA3AF;
        }

        .search-input:focus {
            border-color: #9CA3AF;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.04);
        }

        /* ── Skill pill ── */
        .skill-pill {
            display: inline-block;
            padding: 4px 12px;
            border: 1px solid #E5E7EB;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #374151;
            background: #fff;
            transition: border-color 0.2s;
        }

        .skill-pill:hover {
            border-color: #9CA3AF;
        }

        /* ── Section rule ── */
        .rule {
            height: 1px;
            background: #E5E7EB;
        }

        /* ── Scrollable tabs ── */
        .tabs-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 2px;
        }

        .tabs-row::-webkit-scrollbar {
            display: none;
        }

        /* ── Empty state ── */
        .empty-state {
            text-align: center;
            padding: 5rem 0;
            color: #9CA3AF;
        }

        .empty-state p:first-child {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .empty-state p:last-child {
            font-size: 0.875rem;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #F9FAFB;
        }

        ::-webkit-scrollbar-thumb {
            background: #D1D5DB;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #9CA3AF;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;

        /* ═══════════════════════════════════════════════

                highlights: ['Custom Attention Module', 'SHAP Attribution', 'Feature Engineering'],

            },

        const ALL_ARTICLES = [
            {
                id: 'airflow-vs-prefect',
                date: 'May 2025',
                tag: 'Data Engineering',

                title: 'Airflow vs. Prefect: Choosing an Orchestrator for Your First Pipeline',

            {

                tag: 'MLOps',

                title: 'Getting Started with MLflow: Experiment Tracking for Beginners',
                desc: 'How MLflow fits into the ML development workflow — from logging runs and parameters to comparing model versions and organizing experiments without overhead.',
                url: '#',

            {

                desc: 'Step-by-step walkthrough of applying SHAP values to tabular PyTorch models — global importance plots, local explanations, and common pitfalls to avoid.',
                url: '#',
                featured: true,
            },
        ];

        const PROJECT_CATS = ['All', 'Data Engineering', 'MLOps', 'Deep Learning'];
        const ARTICLE_CATS = ['All', 'Data Engineering', 'MLOps', 'Deep Learning', 'Tools & Tips'];

        const SKILLS = {
            'Data Engineering': ['Apache Airflow', 'dbt', 'PostgreSQL', 'Pandas', 'Polars'],
            'ML / AI': ['PyTorch', 'scikit-learn', 'MLflow', 'SHAP', 'Optuna'],
            'Infrastructure': ['Docker', 'GitHub Actions', 'Linux', 'Git'],
            'Languages': ['Python', 'SQL', 'Bash'],
        };

        /* ═══════════════════════════════════════════════
           ROUTER
        ═══════════════════════════════════════════════ */

        function getPageFromHash() {
            const h = window.location.hash;
            if (h.startsWith('#/projects')) return 'projects';
            if (h.startsWith('#/articles')) return 'articles';
            return 'home';
        }

        /* ═══════════════════════════════════════════════
           ICONS
        ═══════════════════════════════════════════════ */

        const GithubIcon = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z" />

            <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor">
                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />

        );

            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">

                <polyline points="15 3 21 3 21 9" /><line x1="10" y1="14" x2="21" y2="3" />

        );

        const SearchIcon = () => (
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
        );

        /* ═══════════════════════════════════════════════
           SHARED COMPONENTS
        ═══════════════════════════════════════════════ */

        /* ── Navbar ── */
        function Navbar({ page, onNavigate, onScrollToAbout }) {
            const [scrolled, setScrolled] = useState(false);
            const [mobileOpen, setMobileOpen] = useState(false);

            useEffect(() => {
                const fn = () => setScrolled(window.scrollY > 24);
                window.addEventListener('scroll', fn, { passive: true });
                return () => window.removeEventListener('scroll', fn);
            }, []);

            // Close mobile menu on page change
            useEffect(() => { setMobileOpen(false); }, [page]);

            const handleAbout = (e) => {
                e.preventDefault();
                setMobileOpen(false);
                onScrollToAbout();
            };

            const navItems = [
                { label: 'Projects', page: 'projects', href: '#/projects' },
                { label: 'Articles', page: 'articles', href: '#/articles' },
            ];

            const isOpaque = scrolled || page !== 'home';

            return (
                <header
                    id="navbar"
                    className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${isOpaque ? 'bg-white/95 backdrop-blur-sm border-b border-slate-100' : 'bg-transparent'
                        }`}
                >
                    <div className="max-w-6xl mx-auto px-6 md:px-10 py-4 flex items-center justify-between">

                        {/* Logo */}
                        <a
                            href="#/"
                            style={{ textDecoration: 'none' }}
                            className="flex items-center gap-2 group"
                        >
                            <span className="text-sm font-bold tracking-tight text-ink">Kevin Lin</span>
                            <span className="text-slate-300">|</span>
                            <span className="text-sm font-medium text-slate-500 group-hover:text-ink transition-colors">Data Portfolio</span>
                        </a>

                        {/* Desktop Nav */}
                        <nav className="hidden md:flex items-center gap-7">
                            {navItems.map(item => (
                                <a
                                    key={item.label}
                                    href={item.href}
                                    className={`nav-link ${page === item.page ? 'is-active' : ''}`}
                                >
                                    {item.label}
                                </a>
                            ))}
                            <a href="#about" className="nav-link" onClick={handleAbout}>About</a>
                            <div className="w-px h-4 bg-slate-200" />
                            <a href="https://github.com/KevinLin13" target="_blank" rel="noopener noreferrer" className="text-slate-400 hover:text-ink transition-colors" aria-label="GitHub">
                                <GithubIcon />
                            </a>
                            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" className="text-slate-400 hover:text-ink transition-colors" aria-label="LinkedIn">
                                <LinkedinIcon />
                            </a>
                        </nav>

                        {/* Mobile toggle */}
                        <button
                            className="md:hidden p-2 text-slate-500 hover:text-ink transition-colors"
                            onClick={() => setMobileOpen(v => !v)}
                            aria-label="Toggle menu"
                        >
                            {mobileOpen ? (
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                    <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
                                </svg>
                            ) : (
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                    <line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="18" x2="21" y2="18" />
                                </svg>
                            )}
                        </button>
                    </div>

                    {/* Mobile dropdown */}
                    {mobileOpen && (
                        <div className="md:hidden bg-white border-t border-slate-100 px-6 py-5 flex flex-col gap-4">
                            {navItems.map(item => (
                                <a
                                    key={item.label}
                                    href={item.href}
                                    className={`nav-link text-base ${page === item.page ? 'is-active' : ''}`}

                            <div className="rule mt-1" />
                            <div className="flex gap-5 pt-1">
                                <a href="https://github.com/KevinLin13" target="_blank" rel="noopener noreferrer" className="text-slate-400 hover:text-ink transition-colors"><GithubIcon /></a>
                                <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" className="text-slate-400 hover:text-ink transition-colors"><LinkedinIcon /></a>
                            </div>
                        </div>
                    )}
                </header>
            );

        /* ── Footer ── */
        function Footer() {
            const year = new Date().getFullYear();
            return (
                <footer className="border-t border-slate-100 bg-paper py-10">
                    <div className="max-w-6xl mx-auto px-6 md:px-10 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">

                        <div className="flex flex-col md:items-end gap-1">

        /* ── Project Card ── */
        function ProjectCard({ project, index }) {
            return (
                <article
                    className="project-card border border-slate-100 rounded-xl bg-white p-7 flex flex-col gap-5 animate-fade-up"

                    <span className="tag-chip self-start">{project.tag}</span>

                        <a href={project.github} target="_blank" rel="noopener noreferrer" className="ghost-btn">
                            Source Code <ArrowIcon />
                        </a>
                        <a href={project.notion} target="_blank" rel="noopener noreferrer" className="ghost-btn">
                            Architecture Digest <ExternalIcon />
                        </a>
                    </div>
                </article>
            );
        }

        /* ── Article Row ── */
        function ArticleRow({ article, index }) {
            return (
                <a
                    href={article.url}
                    target="_blank"
                    rel="noopener noreferrer"
                    style={{ textDecoration: 'none', display: 'block' }}
                    className="animate-fade-up"
                    style={{ animationDelay: `${0.05 + index * 0.1}s`, opacity: 0 }}
                >
                    <article className="article-row py-5 px-3 -mx-3 flex flex-col md:flex-row md:items-start md:gap-10 group">
                        <div className="text-xs font-mono text-slate-400 mb-1.5 md:mb-0 md:w-24 flex-shrink-0 pt-0.5">{article.date}</div>
                        <div className="flex-1">
                            <span className="tag-chip mb-2 inline-block">{article.tag}</span>
                            <h3 className="text-sm font-bold text-ink group-hover:text-slate-500 transition-colors mb-1">{article.title}</h3>
                            <p className="text-sm text-slate-500 font-light leading-relaxed">{article.desc}</p>

        function LatestArticles({ onNavigate }) {

        function AboutSection() {
            return (
                <section id="about" className="border-t border-slate-100 bg-white py-16">

                            <div className="space-y-4 text-base text-slate-500 leading-relaxed font-light">
                                <p>
                                    I'm <strong className="font-semibold text-slate-700">Kevin Lin（林建璋）</strong>, currently building a path toward a career in the data industry. My interest spans data engineering, analytics, and applied AI — areas I explore through self-directed, end-to-end projects.
                                </p>
                                <p>
                                    Each project in this portfolio reflects genuine implementation effort: real architectural decisions, real debugging, and real documentation. I believe the best way to learn data systems is to build them — then explain what you built and why.
                                </p>
                                <p>
                                    I'm actively seeking opportunities as a <strong className="font-medium text-slate-700">Data Engineer, Data Analyst, or AI Application Engineer</strong> where I can contribute practically and grow alongside an experienced team.
                                </p>
                            </div>
                            <div className="mt-8 flex flex-wrap gap-3">
                                <a href="https://github.com/KevinLin13" target="_blank" rel="noopener noreferrer" className="ghost-btn">
                                    <GithubIcon size={15} /> GitHub
                                </a>
                                <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" className="ghost-btn">
                                    <LinkedinIcon size={15} /> LinkedIn
                                </a>
                                <a href="mailto:kevin@example.com" className="ghost-btn">Email Me</a>
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        function HomePage({ onNavigate }) {
            return (
                <>
                    <Hero onNavigate={onNavigate} />
                    <div className="rule" />
                    <FeaturedProjects onNavigate={onNavigate} />
                    <LatestArticles onNavigate={onNavigate} />
                    <SkillsSection />
                    <AboutSection />
                </>
            );
        }

        /* ═══════════════════════════════════════════════
           PROJECTS PAGE  (#/projects)
        ═══════════════════════════════════════════════ */

        function ProjectsPage() {
            const [query, setQuery] = useState('');
            const [activeCat, setActiveCat] = useState('All');

            const filtered = useMemo(() => {
                const q = query.toLowerCase().trim();
                return PROJECTS.filter(p => {
                    const matchCat = activeCat === 'All' || p.category === activeCat;
                    const haystack = (p.title + ' ' + p.description + ' ' + p.tag + ' ' + p.highlights.join(' ')).toLowerCase();
                    const matchQ = !q || haystack.includes(q);
                    return matchCat && matchQ;
                });
            }, [query, activeCat]);

            return (
                <div className="page-enter">
                    <div className="max-w-6xl mx-auto px-6 md:px-10 pt-28 md:pt-32 pb-20">

                        {/* Page header */}
                        <div className="mb-10 animate-fade-up d1">
                            <span className="tag-chip mb-3 inline-block">Portfolio</span>
                            <h1 className="text-3xl md:text-4xl font-extrabold text-ink tracking-tight mb-2">All Projects</h1>
                            <p className="text-sm text-slate-500 font-light">End-to-end implementations across data engineering, MLOps, and AI.</p>
                        </div>

                        {/* Controls */}
                        <div className="flex flex-col gap-4 mb-6 animate-fade-up d2">
                            <SearchBar
                                value={query}
                                onChange={setQuery}
                                placeholder="Search by title, tool, or keyword…"
                            />
                            <FilterTabs
                                categories={PROJECT_CATS}
                                active={activeCat}
                                onChange={setActiveCat}
                            />
                        </div>

                        {/* Result count */}
                        <p className="text-xs text-slate-400 mb-6 font-medium">
                            {filtered.length} {filtered.length === 1 ? 'project' : 'projects'}
                            {activeCat !== 'All' ? ` in ${activeCat}` : ''}
                            {query ? ` matching "${query}"` : ''}
                        </p>

                        {/* Grid */}
                        {filtered.length > 0 ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                                {filtered.map((p, i) => <ProjectCard key={p.id} project={p} index={i} />)}
                            </div>
                        ) : (
                            <div className="empty-state">
                                <p>No projects found</p>
                                <p>Try a different keyword or select another category.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        /* ═══════════════════════════════════════════════
           ARTICLES PAGE  (#/articles)
        ═══════════════════════════════════════════════ */

        function ArticlesPage() {
            const [query, setQuery] = useState('');
            const [activeCat, setActiveCat] = useState('All');

            const filtered = useMemo(() => {
                const q = query.toLowerCase().trim();
                return ALL_ARTICLES.filter(a => {
                    const matchCat = activeCat === 'All' || a.category === activeCat;
                    const haystack = (a.title + ' ' + a.desc + ' ' + a.tag).toLowerCase();
                    const matchQ = !q || haystack.includes(q);
                    return matchCat && matchQ;
                });
            }, [query, activeCat]);

            return (
                <div className="page-enter">
                    <div className="max-w-6xl mx-auto px-6 md:px-10 pt-28 md:pt-32 pb-20">

                        {/* Page header */}
                        <div className="mb-10 animate-fade-up d1">
                            <span className="tag-chip mb-3 inline-block">Writing</span>
                            <h1 className="text-3xl md:text-4xl font-extrabold text-ink tracking-tight mb-2">All Articles</h1>
                            <p className="text-sm text-slate-500 font-light">Notes and writeups on data systems, tools, and concepts I've explored firsthand.</p>
                        </div>

                        {/* Controls */}
                        <div className="flex flex-col gap-4 mb-6 animate-fade-up d2">
                            <SearchBar
                                value={query}
                                onChange={setQuery}
                                placeholder="Search by title, topic, or keyword…"

                            <FilterTabs
                                categories={ARTICLE_CATS}
                                active={activeCat}
                                onChange={setActiveCat}
                            />
                        </div>

                        {/* Result count */}
                        <p className="text-xs text-slate-400 mb-2 font-medium">
                            {filtered.length} {filtered.length === 1 ? 'article' : 'articles'}
                            {activeCat !== 'All' ? ` in ${activeCat}` : ''}
                            {query ? ` matching "${query}"` : ''}
                        </p>

                        {/* List */}
                        {filtered.length > 0 ? (
                            <div className="flex flex-col divide-y divide-slate-100">
                                {filtered.map((a, i) => <ArticleRow key={a.id} article={a} index={i} />)}
                            </div>
                        ) : (
                            <div className="empty-state" style={{ marginTop: '3rem' }}>
                                <p>No articles found</p>
                                <p>Try a different keyword or select another category.</p>
                            </div>

        }

        /* ═══════════════════════════════════════════════
           APP  (Router)
        ═══════════════════════════════════════════════ */

        function App() {
            const [page, setPage] = useState(getPageFromHash);

            useEffect(() => {
                const handler = () => {
                    const next = getPageFromHash();
                    setPage(prev => {
                        if (prev !== next) window.scrollTo({ top: 0, behavior: 'instant' });
                        return next;
                    });
                };
                window.addEventListener('hashchange', handler);
                return () => window.removeEventListener('hashchange', handler);
            }, []);

            const navigate = useCallback((target) => {
                const hash = target === 'home' ? '#/' : `#/${target}`;
                if (window.location.hash !== hash) {
                    window.location.hash = hash;
                } else if (target === 'home') {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }, []);

            const scrollToAbout = useCallback(() => {
                if (page !== 'home') {
                    window.location.hash = '#/';
                    setTimeout(() => {
                        document.getElementById('about')?.scrollIntoView({ behavior: 'smooth' });
                    }, 360);
                } else {
                    document.getElementById('about')?.scrollIntoView({ behavior: 'smooth' });
                }
            }, [page]);

            return (
                <div className="min-h-screen bg-paper">
                    <Navbar page={page} onNavigate={navigate} onScrollToAbout={scrollToAbout} />
                    <main>
                        {page === 'home' && <HomePage onNavigate={navigate} />}
                        {page === 'projects' && <ProjectsPage />}
                        {page === 'articles' && <ArticlesPage />}
                    </main>
                    <Footer />
                </div>
            );
        }

        /* Mount */
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
