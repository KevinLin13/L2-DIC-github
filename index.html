<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人首頁 - 林建璋</title>
    <meta name="description" content="林建璋的個人首頁，展示即時日期與時間。">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+TC:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --glow-color: rgba(99, 102, 241, 0.15);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Background animated blobs for a premium look */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
            animation: float 20s infinite alternate;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: rgba(99, 102, 241, 0.3);
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: rgba(192, 132, 252, 0.25);
            bottom: -15%;
            right: -10%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(50px, 30px) scale(1.1);
            }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 540px;
        }

        /* Glassmorphism Card */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3rem 2rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3),
                        0 0 40px var(--glow-color);
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
                        0 0 60px rgba(99, 102, 241, 0.25);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .welcome-badge {
            display: inline-block;
            padding: 0.5rem 1.2rem;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #c084fc;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        .greeting {
            font-size: 1.5rem;
            font-weight: 300;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .name {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2.5rem;
            line-height: 1.2;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1) 50%, transparent);
            margin: 2rem 0;
        }

        .time-wrapper {
            margin-top: 1.5rem;
        }

        .date-display {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            letter-spacing: 0.02em;
        }

        .time-display {
            font-size: 2.5rem;
            font-weight: 600;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .card {
                padding: 2.5rem 1.5rem;
            }
            .name {
                font-size: 2.5rem;
            }
            .time-display {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient background animations -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container">
        <main class="card">
            <span class="welcome-badge">Welcome</span>
            
            <p class="greeting">Hello, my name is</p>
            <h1 class="name">林建璋</h1>
            
            <div class="divider"></div>
            
            <div class="time-wrapper">
                <div class="date-display" id="date">載入中...</div>
                <div class="time-display" id="time">00:00:00</div>
            </div>
        </main>
    </div>

    <script>
        function updateDateTime() {
            const now = new Date();
            
            // Format date nicely
            const options = { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric', 
                weekday: 'long' 
            };
            const formattedDate = now.toLocaleDateString('zh-TW', options);
            
            // Format time with 2-digit padding
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const formattedTime = `${hours}:${minutes}:${seconds}`;
            
            document.getElementById('date').textContent = formattedDate;
            document.getElementById('time').textContent = formattedTime;
        }

        // Initialize and set interval to update every second
        updateDateTime();
        setInterval(updateDateTime, 1000);
    </script>
</body>
</html>
